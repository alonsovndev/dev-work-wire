[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devworkwire"
version = "0.1.0"
description = "Load an already-defined work structure (Epics, Stories, Acceptance Criteria) into your project tracker — validated, previewed, and duplicate-free."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "alonsovndev" }]
requires-python = ">=3.12"
keywords = ["jira", "cli", "backlog", "epics", "user-stories", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Bug Tracking",
]
dependencies = [
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyaml-env>=1.2.1",
    "httpx>=0.25.0",
    "backoff>=2.2.1",
    "jira>=3.5.0",
    "typer>=0.9.0",
    "InquirerPy>=0.3.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "respx>=0.20.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.scripts]
dwire = "devworkwire.presentation.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
# Keep the default rule set (pycodestyle errors + pyflakes); extend deliberately.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "strict"

[tool.coverage.run]
source = ["src/devworkwire"]
